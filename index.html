<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Hemocentro JP"/>
<meta name="theme-color" content="#dc2626"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<title>Hemocentro JP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  /* paleta sóbria */
  --red:#DC2626;--red-light:#FEE2E2;--red-dark:#B91C1C;
  --blue:#2563EB;--blue-light:#DBEAFE;--blue-mid:#3B82F6;
  --green:#059669;--green-light:#D1FAE5;
  --orange:#D97706;--orange-light:#FEF3C7;
  --purple:#7C3AED;--purple-light:#EDE9FE;
  --teal:#0891B2;--teal-light:#CFFAFE;
  --bg:#F6F7F9;--card:#fff;--border:#E7EAEF;
  --text:#111827;--sub:#5B6472;--muted:#98A1AE;
  --sf:#F7F8FA;--sf2:#EEF0F4;--tint-blue:#EFF4FE;--tint-warm:#FEF6E7;
  /* tipografia */
  --fs-xs:11.5px;--fs-sm:13px;--fs-base:14.5px;--fs-md:16px;--fs-lg:18px;--fs-xl:22px;--fs-2xl:27px;
  /* espaçamento */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 2px 6px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.08);
  --shadow-lg:0 10px 24px rgba(16,24,40,.10),0 20px 48px rgba(16,24,40,.12);
}
body.dark{
  --red-light:#3a1d20;--blue-light:#17304f;--green-light:#123526;
  --orange-light:#3a2a15;--purple-light:#251b3a;--teal-light:#123330;
  --bg:#0b1220;--card:#111a2b;--border:#243349;
  --text:#e8edf5;--sub:#9aa7bb;--muted:#6a778c;
  --sf:#141f31;--sf2:#1c2b42;--tint-blue:#152a44;--tint-warm:#2f2617;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 12px 34px rgba(0,0,0,.55);
}
body.dark{background:var(--bg)}
body.dark input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:var(--fs-base);line-height:1.45}
h1,h2,h3{letter-spacing:-.01em}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* SVG icons */
.ic{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-4px}
.ic-sm{width:16px;height:16px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;flex-shrink:0;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--sf2);color:var(--text)}
.icon-btn .ic{width:18px;height:18px}

/* ── SHELL ── */
#app{display:flex;height:100vh;overflow:hidden}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;backdrop-filter:blur(4px)}
#overlay.on{display:block}
#sidebar{
  position:fixed;top:0;left:0;height:100vh;width:256px;
  background:#0e1726;border-right:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;z-index:101;
  transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;overflow-x:hidden;
}
#sidebar.on{transform:translateX(0)}
@media(min-width:768px){
  #sidebar{position:relative;transform:translateX(0)!important;flex-shrink:0}
  #overlay{display:none!important}
  #hambtn{display:none!important}
}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{
  background:var(--card);display:flex;align-items:center;
  justify-content:space-between;padding:0 var(--sp-4);height:56px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  position:relative;z-index:10;
}
#page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--sp-4) max(var(--sp-4),calc((100% - 1120px) / 2))}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-in{animation:fadeUp .22s ease forwards}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-4);box-shadow:var(--shadow);margin-bottom:var(--sp-3)}
.card-title{font-weight:700;font-size:var(--fs-sm);color:var(--text);margin-bottom:var(--sp-3);letter-spacing:.01em}

/* ── SIDEBAR NAV ── */
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;width:100%;text-align:left;font-size:var(--fs-sm);font-weight:600;margin-bottom:2px;background:transparent;color:#8B98AB;cursor:pointer;transition:background .12s,color .12s;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--blue);color:#fff}
.nav-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-icon .ic{width:19px;height:19px}
.nav-badge{background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:800;margin-left:auto}

/* ── BUTTONS ── */
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:650;font-size:var(--fs-sm);cursor:pointer;font-family:inherit;transition:filter .12s,transform .06s,background .12s;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;line-height:1}
.btn .ic{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.04)}
.btn-primary{background:var(--blue);color:#fff}
.btn-danger{background:var(--red-light);color:var(--red)}
.btn-success{background:var(--green-light);color:var(--green)}
.btn-ghost{background:var(--sf2);color:var(--sub);border-color:var(--border)}
.btn-full{width:100%;padding:13px;font-size:var(--fs-base);border-radius:12px}
.btn-green-full{background:var(--green);color:#fff}
.btn-red-full{background:var(--red);color:#fff}
.btn-disabled{background:var(--sf2)!important;color:var(--muted)!important;cursor:not-allowed!important;box-shadow:none!important;filter:none!important}

/* ── BADGES ── */
.badge{border-radius:8px;padding:3px 8px;font-size:var(--fs-xs);font-weight:650;display:inline-flex;align-items:center;gap:4px}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-gray{background:var(--sf2);color:var(--sub)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.live{display:inline-flex;align-items:center;gap:5px;background:var(--green-light);color:var(--green);border-radius:8px;padding:3px 8px;font-size:var(--fs-xs);font-weight:650}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.9}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;font-size:var(--fs-xs);color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td{padding:11px 10px;font-size:var(--fs-sm);color:var(--text);vertical-align:middle;border-bottom:1px solid var(--sf2)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--sf) 55%,transparent)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--sf2)}

/* ── INPUTS ── */
label{display:block;font-weight:600;font-size:var(--fs-xs);color:var(--sub);margin-bottom:6px;margin-top:14px;letter-spacing:.02em}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:var(--fs-md);outline:none;font-family:inherit;background:var(--card);color:var(--text);transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;touch-action:manipulation;display:block;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
textarea{resize:none;line-height:1.6}
input[type=checkbox],input[type=radio]{-webkit-appearance:auto;appearance:auto;width:18px;height:18px;min-width:18px;padding:0;accent-color:var(--blue)}
input[type=date]{-webkit-appearance:none;appearance:none}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px);padding:0}
@media(min-width:500px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:480px;box-shadow:var(--shadow-lg);animation:slideUp .26s cubic-bezier(.4,0,.2,1);max-height:92vh;display:flex;flex-direction:column}
@media(min-width:500px){.modal{border-radius:16px;animation:popIn .2s ease;max-height:85vh}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:10px auto 0;flex-shrink:0}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-body{padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-title{font-weight:700;font-size:var(--fs-lg);color:var(--text);letter-spacing:-.01em}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:4px;border-radius:8px}
.modal-close:hover{background:var(--sf2);color:var(--text)}

/* ── TOAST ── */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:500;pointer-events:none;transition:opacity .3s}
.toast-body{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:var(--fs-sm);font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:90vw}

/* ── AVATAR ── */
.av{border-radius:50%;object-fit:cover;flex-shrink:0}
.av-ini{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border-radius:50%;flex-shrink:0}

/* ── SECTOR CARD ── */
.sec-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.sec-card:hover{box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--blue) 30%,var(--border))}
.sec-card:active{transform:scale(.98)}

/* ── STAT CARD ── */
.stat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sf2)}
.stat:last-child{border-bottom:none}

/* ── BOTTOM NAV ── */
#bnav{display:flex;background:var(--card);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px 6px;border:none;background:none;cursor:pointer;font-size:9.5px;font-weight:650;color:var(--muted);gap:3px;transition:color .12s;touch-action:manipulation;font-family:inherit;position:relative}
.bnav-btn.on{color:var(--blue)}
.bnav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.bnav-icon .ic{width:21px;height:21px}
.bnav-dot{position:absolute;top:5px;right:calc(50% - 15px);width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--card)}

/* ── SKELETON LOADER ── */
.skel{background:linear-gradient(90deg,var(--sf2) 25%,var(--border) 50%,var(--sf2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}

/* ── PONTO WIDGET ── */
.ponto-hero{border-radius:16px;overflow:hidden;margin-bottom:var(--sp-3);border:1px solid var(--border);box-shadow:var(--shadow)}
.ponto-top{padding:16px 18px;background:#0e1726;color:#fff}
.ponto-bottom{background:var(--card);padding:16px}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,#16233b 0%,#0b1220 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px 24px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
.inp-wrap{position:relative;margin-bottom:12px}
.inp-wrap input{padding-left:42px}
.inp-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);display:flex}

/* ── REPORT CARD ── */
.report-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-bottom:8px;cursor:pointer;transition:box-shadow .12s,border-color .12s;touch-action:manipulation}
.report-card:hover{box-shadow:var(--shadow-md)}
.report-card:active{transform:scale(.99)}
.report-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.report-icon .ic{width:22px;height:22px}

/* ── CALENDAR ── */
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;touch-action:manipulation;transition:all .12s;border:2px solid transparent}
.cal-day:active{transform:scale(.92)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

/* ── NOTIF ITEM ── */
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty .ic{width:36px;height:36px;stroke-width:1.4;margin-bottom:8px;opacity:.65}
.empty p{font-size:var(--fs-sm);margin-bottom:12px}

/* ── DASHBOARD ── */
.dash-h{font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 2px 10px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:var(--sp-4)}
@media(min-width:560px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi-label{font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.kpi-label .ic{width:14px;height:14px}
.kpi-value{font-size:var(--fs-2xl);font-weight:750;color:var(--text);margin-top:6px;line-height:1;letter-spacing:-.02em}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:var(--sp-4)}
.sec-name{font-weight:650;font-size:var(--fs-sm);line-height:1.25;margin-bottom:8px}
.sec-count{font-size:var(--fs-xl);font-weight:750;color:var(--text);line-height:1}
.sec-count small{font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.sec-bar{height:4px;border-radius:3px;background:var(--sf2);margin-top:9px;overflow:hidden}
.sec-bar>i{display:block;height:100%;border-radius:3px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--sp-3);align-items:start}
@media(max-width:860px){.dash-grid{grid-template-columns:1fr}}
.qa-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-weight:600;font-size:var(--fs-sm);cursor:pointer;font-family:inherit;margin-bottom:8px;transition:background .12s,border-color .12s;text-align:left}
.qa-btn:last-child{margin-bottom:0}
.qa-btn:hover{background:var(--sf);border-color:color-mix(in srgb,var(--blue) 32%,var(--border))}
.qa-btn .ic{color:var(--sub);width:18px;height:18px}
</style>
</head>

// ── HASH DE SENHA (ofuscação no cliente; a proteção real são as regras do Firebase) ──
async function sha256Hex(str){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(str)));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function senhaConfere(digitada,armazenada){
  if(!armazenada)return false;
  if(HASH_RE.test(armazenada))return (await sha256Hex(digitada))===armazenada.toLowerCase();
  return digitada===armazenada; // legado em texto puro (migrado no 1º login bem-sucedido)
}

// redimensiona e comprime imagem -> dataURL JPEG (evita fotos gigantes no banco)
function shrinkImg(file,maxpx){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("falha ao ler o arquivo"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("arquivo de imagem inválido"));
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>=h&&w>maxpx){h=Math.round(h*maxpx/w);w=maxpx}
        else if(h>w&&h>maxpx){w=Math.round(w*maxpx/h);h=maxpx}
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{res(cv.toDataURL("image/jpeg",0.72))}catch(e){rej(e)}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// ── SOUND ──
function beep(type){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const t=audioCtx.currentTime;
    if(type==="start"){
      o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.1);o.frequency.setValueAtTime(784,t+.2);
      g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.start(t);o.stop(t+.5);
    }else if(type==="end"){
      o.frequency.setValueAtTime(784,t);o.frequency.setValueAtTime(523,t+.15);
      g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.start(t);o.stop(t+.5);
    }else{
      o.frequency.setValueAtTime(440,t);
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
      o.start(t);o.stop(t+.25);
    }
  }catch(e){}
  try{if(type==="start")navigator.vibrate&&navigator.vibrate([80,40,80]);
    else if(type==="end")navigator.vibrate&&navigator.vibrate([150]);}catch(e){}
}

function listen(){

  uns.push(onValue(ref(db,"medicos"),s=>{DB.med=s.val()||{};done()}));
  uns.push(onValue(ref(db,"plantoes"),s=>{DB.plt=s.val()||{};done()}));
  uns.push(onValue(ref(db,"notificacoes"),s=>{
    const v=s.val()||{};DB.notif=v;
    const comTs=Object.values(v).filter(n=>n&&n.ts);
    const maxTs=comTs.reduce((a,n)=>Math.max(a,n.ts),0);
    if(lastNotifTs&&maxTs>lastNotifTs){
      const last=comTs.filter(n=>n.ts>lastNotifTs).sort((a,b)=>a.ts-b.ts).pop();
      beep("notif");toast(last?.texto||"Nova notificação","🔔");
    }
    if(maxTs>lastNotifTs)lastNotifTs=maxTs;
    done();
  }));
  uns.push(onValue(ref(db,"anuncios"),s=>{DB.anun=s.val()||{};done()}));
  uns.push(onValue(ref(db,"escalas"),s=>{DB.esc=s.val()||{};done()}));
}

window.doLogin=async function(){
  const crm=($("lcrm")||{}).value?.trim(),sen=($("lsen")||{}).value?.trim();
  const err=$("lerr"),btn=$("lbtn");
  if(!crm||!sen){if(err){err.style.display="block";err.textContent="⚠ Preencha CRM e senha.";}return}
  if(err)err.style.display="none";
  if(btn){btn.textContent="Verificando...";btn.disabled=true;}
  const fail=t=>{if(err){err.style.display="block";err.textContent=t}if(btn){btn.textContent="Entrar no Sistema";btn.disabled=false}};
  try{
    if(AUTH_MODE==="firebase"){
      let cred;
      try{cred=await signInWithEmailAndPassword(fbAuth,emailForCrm(crm),sen)}
      catch(e){return fail("⚠ CRM ou senha incorretos.")}
      const snap=await get(ref(db,`medicos/crm_${crm}`));
      const d=snap.exists()?snap.val():{crm,nome:cred.user.displayName||`CRM ${crm}`,role:"plantonista"};
      U={...d,key:`crm_${crm}`,uid:cred.user.uid,gestor:!!(await cred.user.getIdTokenResult()).claims.gestor};
      if(U.gestor)U.role="gestor";
      sessionStorage.setItem("hemo_u",JSON.stringify(U));
      lastNotifTs=0;dataLoaded=false;document.body.style.background="var(--bg)";
      listen();return;
    }
    const snap=await get(ref(db,`medicos/crm_${crm}`));
    if(!snap.exists())return fail("⚠ CRM não encontrado.");
    const d=snap.val();
    if(!(await senhaConfere(sen,d.senha)))return fail("⚠ Senha incorreta.");
    // migração transparente: senha em texto puro -> hash no 1º login bem-sucedido
    if(!HASH_RE.test(d.senha||"")){
      const h=await sha256Hex(sen);
      update(ref(db,`medicos/crm_${crm}`),{senha:h}).catch(()=>{});
      d.senha=h;
    }
    U={...d,key:`crm_${crm}`,uid:d.uid||null};
    sessionStorage.setItem("hemo_u",JSON.stringify(U));
    lastNotifTs=0;dataLoaded=false;document.body.style.background="var(--bg)";
    listen();
  }catch(e){fail("⚠ Erro de conexão.")}
};

window.doLogout=function(){

  if(AUTH_MODE==="firebase"&&fbAuth)signOut(fbAuth).catch(()=>{});
  document.body.style.background="#0a1628";
  render();
};

  const notifs=Object.values(DB.notif).reverse();
  const anuns=Object.entries(DB.anun).map(([k,v])=>({...v,key:k})).reverse();

  const NAV=[
    {id:"dashboard",icon:"grid",label:"Dashboard"},
    {id:"plantoes",icon:"clipboard",label:"Plantões"},

    {id:"compartilhar",icon:"share",label:"Compartilhar"},

  const PAGES={
    dashboard:gDash(meds,plts,ativos,notifs,anuns),
    plantoes:gPlantoes(plts),
    medicos:gMedicos(meds),

    anuncios:gAnuncios(anuns),

    almoco:pgAlmoco(),

  };

  $("app").innerHTML=`

  <aside id="sidebar">
    <div style="padding:20px 16px 16px;border-bottom:1px solid #1a2d42;display:flex;align-items:center;gap:12px">
      ${brandMark(22)}
      <div><div style="color:#fff;font-weight:750;font-size:15px;letter-spacing:-.01em">Hemocentro JP</div><div style="color:#7a8aa0;font-size:11px">Painel do Gestor</div></div>
    </div>
    <nav style="flex:1;padding:10px 8px">
      ${NAV.map(n=>`<button class="nav-item ${pg===n.id?"on":""}" onclick="gPage('${n.id}')">
        <span class="nav-icon">${ic(n.icon)}</span>${n.label}
      </button>`).join("")}
      <div style="height:1px;background:rgba(255,255,255,.07);margin:10px 4px"></div>
      <button class="nav-item" style="color:#f0808a" onclick="doLogout()">
        <span class="nav-icon">${ic("logout")}</span>Sair
      </button>

    </div>
  </aside>

    <header id="topbar">

        ${pg!=="dashboard"?`<button onclick="gPage('dashboard')" aria-label="Voltar ao Dashboard" title="Voltar ao Dashboard" class="icon-btn">${ic("back")}</button>`:""}

          <div style="font-weight:700;font-size:var(--fs-lg);color:var(--text);letter-spacing:-.01em">${NAV.find(n=>n.id===pg)?.label||"Dashboard"}</div>
          <div style="font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:5px"><span class="live-dot"></span>Ao vivo</div>

      <div style="display:flex;align-items:center;gap:8px">
        ${themeBtn()}
        ${av(U.foto,U.nome,36)}
      </div>
    </header>
    <div id="page" class="fade-in">${PAGES[pg]||""}</div>
  </div>`;
  startClock();
}

window.gPage=p=>{pg=p;closeSide();render()};
window.openSide=()=>{$("sidebar")?.classList.add("on");$("overlay")?.classList.add("on")};
window.closeSide=()=>{$("sidebar")?.classList.remove("on");$("overlay")?.classList.remove("on")};

// GESTOR PAGES
function gDash(meds,plts,ativos,notifs,anuns){
  const enc=plts.filter(p=>p.status==="encerrado");
  const esquecidos=ativos.filter(p=>p.inicio&&(Date.now()-new Date(p.inicio))/3.6e6>=PLANTAO_ALERTA_H);
  return`
  ${esquecidos.length?`<div class="card" style="border-left:3px solid var(--orange)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--orange)">
      ${ic("alert","ic-sm")}<span style="font-weight:700;font-size:var(--fs-sm)">Plantões abertos há +${PLANTAO_ALERTA_H}h · ${esquecidos.length}</span>
    </div>
    <div style="font-size:var(--fs-xs);color:var(--sub);margin-bottom:8px">Provável falta de baixa. Confira e encerre se for o caso.</div>
    ${esquecidos.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border)">
      <div style="flex:1;font-size:var(--fs-sm);color:var(--text)"><strong>${nm(p.medicoNome,2)}</strong> · ${esc(p.setorNome||"—")} · <span style="color:var(--orange);font-weight:650">${dur(p.inicio,null)}</span></div>
      <button class="btn btn-danger" style="padding:4px 10px" onclick="encP('${p.key}')">Encerrar</button>
    </div>`).join("")}
  </div>`:""}
  ${anuns.length?`<div class="card" style="background:#0e1726;border-color:#0e1726;color:#fff">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#c9d3e2">
      ${ic("megaphone","ic-sm")}<span style="font-weight:650;font-size:var(--fs-sm)">Anúncios · ${anuns.length}</span>
    </div>
    ${anuns.slice(0,2).map(a=>`<div style="background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;margin-bottom:6px">
      <div style="font-weight:650;font-size:var(--fs-sm)">${esc(a.titulo)}</div>
      <div style="font-size:var(--fs-sm);opacity:.75;margin-top:2px">${esc(a.texto)}</div>
    </div>`).join("")}
  </div>`:""}

  <div class="kpi-grid">
    ${[
      {ic:"users",l:"Médicos",v:meds.length},
      {ic:"play",l:"Em plantão",v:ativos.length},
      {ic:"check",l:"Encerrados",v:enc.length},
      {ic:"clipboard",l:"Total",v:plts.length},
    ].map(k=>`<div class="kpi"><div class="kpi-label">${ic(k.ic)}${k.l}</div><div class="kpi-value">${k.v}</div></div>`).join("")}
  </div>

  <div class="dash-h">Ocupação por setor · agora</div>
  <div class="sec-grid">
    ${SETORES.map(s=>{
      const c=ativos.filter(p=>p.setorId===s.id).length;
      const pct=Math.min(100,Math.round(c/s.vagas*100));
      return`<div class="sec-card" onclick="gPage('plantoes')">
        <div style="width:30px;height:30px;border-radius:8px;background:${s.cor}1f;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:8px">${s.icone}</div>
        <div class="sec-name" style="color:${s.cor}">${s.nome}</div>
        <div class="sec-count">${c}<small>/${s.vagas}</small></div>
        <div class="sec-bar"><i style="width:${pct}%;background:${s.cor}"></i></div>
      </div>`;
    }).join("")}
  </div>

  <div class="dash-grid">
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="card-title" style="margin:0">Plantões ativos</span>
          <button class="btn btn-primary" style="padding:7px 12px" onclick="openM('novoPlantao')">${ic("plus","ic-sm")}Novo</button>
        </div>
        ${ativos.length===0?`<div class="empty">${ic("clipboard")}<p>Nenhum plantão ativo agora</p></div>`:
        `<div class="tbl-wrap"><table><thead><tr><th>Médico</th><th>Setor</th><th>Início</th><th>Dur.</th><th></th></tr></thead><tbody>
        ${ativos.map(p=>`<tr>
          <td><div style="display:flex;align-items:center;gap:8px">${av(DB.med[p.medicoKey]?.foto||"",p.medicoNome,32)}<div><div style="font-weight:600;font-size:12px">${nm(p.medicoNome,2)}</div><div style="color:var(--muted);font-size:11px">CRM ${esc(p.medicoCrm)}</div></div></div></td>
          <td style="font-size:12px">${esc(p.setorNome)}</td>
          <td style="font-family:monospace;font-size:11px;color:var(--sub)">${fmtDT(p.inicio)}</td>
          <td><span class="badge badge-green">${dur(p.inicio,null)}</span></td>
          <td><button class="btn btn-danger" style="padding:5px 10px" onclick="encP('${p.key}')">Encerrar</button></td>
        </tr>`).join("")}
        </tbody></table></div>`}
      </div>

      <div class="card">
        <div class="card-title">Atividade recente</div>
        ${notifs.slice(0,6).map(n=>`<div class="notif-item">
          <div class="notif-ico" style="background:${n.cor==="green"?"var(--green-light)":"var(--red-light)"};color:${n.cor==="green"?"var(--green)":"var(--red)"}">${ic(n.cor==="green"?"check":"alert","ic-sm")}</div>
          <div><div style="font-size:13px;font-weight:500;color:var(--text)">${esc(n.texto)}</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(n.hora)}</div></div>
        </div>`).join("")||`<div class="empty" style="padding:20px">${ic("bell")}<p>Sem atividade recente</p></div>`}
      </div>
    </div>
    <div>
      <div class="dash-h">Ações rápidas</div>
      <div class="card" style="padding:12px">
        <button class="qa-btn" onclick="openM('novoPlantao')">${ic("plus")} Iniciar plantão</button>
        <button class="qa-btn" onclick="gPage('calendario')">${ic("calendar")} Escalar no calendário</button>
        <button class="qa-btn" onclick="openM('novoAnuncio')">${ic("megaphone")} Publicar anúncio</button>
        <button class="qa-btn" onclick="gPage('relatorios')">${ic("chart")} Ver relatórios</button>
        <button class="qa-btn" onclick="gPage('medicos')">${ic("users")} Gerir médicos</button>
      </div>
    </div>
  </div>`;
}

function gPlantoes(plts){
  const sorted=[...plts].sort((a,b)=>new Date(b.inicio)-new Date(a.inicio));
  return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-weight:900;font-size:18px;color:var(--text)">Plantões</h2>
    <button class="btn btn-primary" onclick="openM('novoPlantao')">${ic("plus","ic-sm")}Novo</button>
  </div>
  <div class="card">
    <div class="tbl-wrap"><table><thead><tr><th>Médico</th><th>Setor</th><th>Início</th><th>Fim</th><th>Duração</th><th>Status</th><th></th></tr></thead><tbody>
    ${sorted.length===0?`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:28px">Nenhum registro</td></tr>`:
    sorted.map(p=>`<tr>
      <td><div style="display:flex;align-items:center;gap:8px">${av(DB.med[p.medicoKey]?.foto||"",p.medicoNome,32)}<div><div style="font-weight:600;font-size:12px">${nm(p.medicoNome,2)}</div><div style="color:var(--muted);font-size:11px">CRM ${esc(p.medicoCrm)}</div></div></div></td>
      <td style="font-size:12px">${esc(p.setorNome)}</td>
      <td style="font-family:monospace;font-size:11px">${fmtDT(p.inicio)}</td>
      <td style="font-family:monospace;font-size:11px">${fmtDT(p.fim)}</td>
      <td><span class="${p.status==="ativo"?"badge badge-green":"badge badge-gray"}">${dur(p.inicio,p.fim)}</span></td>
      <td><span class="${p.status==="ativo"?"badge badge-green":"badge badge-gray"}">● ${p.status}</span></td>
      <td>${p.status==="ativo"?`<button class="btn btn-danger" style="padding:5px 10px;font-size:11px" onclick="encP('${p.key}')">Encerrar</button>`:""}</td>
    </tr>`).join("")}
    </tbody></table></div>
  </div>`;
}

  <div style="background:var(--tint-blue);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--blue)">

  ${anuns.length===0?`<div class="card" style="text-align:center;padding:32px;color:var(--muted)"><div style="font-size:40px;margin-bottom:8px">📢</div>Nenhum anúncio</div>`:

      <div style="flex:1">

        <div style="font-size:13px;color:var(--sub);margin-bottom:8px;line-height:1.5">${esc(a.texto)}</div>

      <button class="btn btn-danger" style="padding:6px 10px" onclick="delAnun('${a.key}')">✕</button>

function gRel(plts,meds){
  const ativos=plts.filter(p=>p.status==="ativo");
  const enc=plts.filter(p=>p.status==="encerrado");
  const totalMin=enc.reduce((a,p)=>p.fim&&p.inicio?a+Math.round((new Date(p.fim)-new Date(p.inicio))/60000):a,0);
  const avgMin=enc.length?Math.round(totalMin/enc.length):0;

  // Por setor
  const porSetor={};
  plts.forEach(p=>{porSetor[p.setorNome]=(porSetor[p.setorNome]||0)+1});
  // Por médico top 5
  const porMed={};
  plts.forEach(p=>{porMed[p.medicoNome]=(porMed[p.medicoNome]||0)+1});
  const top5=Object.entries(porMed).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return`<h2 style="font-weight:900;font-size:18px;color:var(--text);margin-bottom:14px">Relatórios</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    ${[
      {l:"Ativos agora",v:ativos.length,c:"var(--green)",i:"🟢"},
      {l:"Encerrados",v:enc.length,c:"var(--orange)",i:"✅"},
      {l:"Total plantões",v:plts.length,c:"var(--blue)",i:"📊"},
      {l:"Média duração",v:avgMin<60?avgMin+"min":Math.floor(avgMin/60)+"h"+(avgMin%60?""+avgMin%60+"m":""),c:"var(--purple)",i:"⏱️"},
    ].map(r=>`<div class="card" style="padding:14px">
      <div style="font-size:22px;margin-bottom:4px">${r.i}</div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px">${r.l}</div>
      <div style="font-weight:900;font-size:24px;color:${r.c};margin-top:2px">${r.v}</div>
    </div>`).join("")}
  </div>

  ${top5.length?`<div class="card" style="margin-bottom:14px">
    <div class="card-title">🏆 Top Médicos</div>
    ${top5.map(([n,c],i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--sf)">
      <div style="width:26px;height:26px;border-radius:8px;background:${["#FFD700","#C0C0C0","#CD7F32","var(--blue-light)","var(--blue-light)"][i]};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">${i+1}</div>
      ${av("",n,30)}
      <span style="flex:1;font-size:13px;font-weight:600;color:var(--text)">${nm(n)}</span>
      <span class="badge badge-blue">${c} plt.</span>
    </div>`).join("")}
  </div>`:""}

  ${Object.keys(porSetor).length?`<div class="card" style="margin-bottom:16px">
    <div class="card-title">📍 Por Setor</div>
    ${Object.entries(porSetor).map(([nome,qtd])=>{
      const s=SETORES.find(s=>s.nome===nome);
      const pct=Math.round((qtd/plts.length)*100);
      return`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:13px;font-weight:600;color:var(--text)">${s?.icone||"🏥"} ${esc(nome)}</span>
          <span style="font-size:13px;font-weight:700;color:${s?.cor||"var(--blue)"}"><strong>${qtd}</strong> (${pct}%)</span>
        </div>
        <div style="height:6px;background:var(--sf2);border-radius:4px;overflow:hidden">
          <div style="height:100%;border-radius:4px;background:${s?.cor||"var(--blue)"};width:${pct}%;transition:width .3s"></div>
        </div>
      </div>`;
    }).join("")}
  </div>`:""}

  <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">Baixar relatórios</div>
  <div class="card" style="padding:12px 14px;margin-bottom:12px">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1">
        <label style="margin:0 0 4px">Período</label>
        <select id="rel-per" onchange="document.getElementById('rel-mes-wrap').style.display=this.value==='mesesp'?'block':'none'" style="padding:8px 10px;font-size:13px">
          <option value="hoje">Hoje</option><option value="7d">Últimos 7 dias</option>
          <option value="mes" selected>Mês atual</option>
          <option value="mesesp">Escolher mês…</option>
          <option value="tudo">Tudo</option>
        </select>
      </div>
      <div style="flex:1">
        <label style="margin:0 0 4px">Formato</label>
        <select id="rel-fmt" style="padding:8px 10px;font-size:13px">
          <option value="csv" selected>CSV (Excel)</option><option value="txt">Texto</option>
        </select>
      </div>
    </div>
    <div id="rel-mes-wrap" style="display:none;margin-top:10px">
      <label style="margin:0 0 4px">Mês</label>
      <input type="month" id="rel-mes" value="${new Date().toISOString().slice(0,7)}" style="padding:8px 10px;font-size:13px"/>
    </div>
  </div>
  <div>
    ${[
      {tipo:"chegada",icon:"📄",title:"Relatório de Chegada",desc:"Horários de início",cor:"#EF5350"},
      {tipo:"fechamento",icon:"📊",title:"Relatório de Fechamento",desc:"Horários de saída",cor:"#4CAF50"},
      {tipo:"completo",icon:"📋",title:"Relatório Completo",desc:"Todos os plantões com durações",cor:"#2196F3"},
      {tipo:"ausencias",icon:"📉",title:"Relatório de Ausências",desc:"Médicos sem plantão no período",cor:"#FF5722"},
    ].map(r=>`<div class="report-card" onclick="gerarRel('${r.tipo}')">
      <div class="report-icon" style="background:${r.cor}18">${r.icon}</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:14px;color:var(--text)">${r.title}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${r.desc}</div>
      </div>
      <span style="color:${r.cor};font-size:20px">⬇</span>
    </div>`).join("")}
  </div>`;
}

function pgNotifs(notifs){
  return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-weight:900;font-size:18px">Notificações</h2>
    <button class="btn btn-ghost" style="font-size:12px;padding:7px 12px" onclick="limparNotifs()">Limpar</button>
  </div>
  <div class="card">
    ${notifs.length===0?`<div class="empty">${ic("bell")}<p>Sem notificações</p></div>`:
    notifs.map(n=>`<div class="notif-item">

function pgCal(){
  const now=new Date();
  const vy=calY!=null?calY:now.getFullYear();
  const vm=calM!=null?calM:now.getMonth();
  calY=vy;calM=vm;
  const mn=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dn=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const fd=new Date(vy,vm,1).getDay();
  const dim=new Date(vy,vm+1,0).getDate();
  const today=new Date();
  const isGestor=U?.role==="gestor";
  const escs=Object.entries(DB.esc).map(([k,v])=>({...v,key:k})).filter(e=>e.year===vy&&e.month===vm);

  let cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);

  const isToday=d=>d&&today.getFullYear()===vy&&today.getMonth()===vm&&today.getDate()===d;
  const isPast=d=>d&&new Date(vy,vm,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());

  return`${isGestor?"":`<button class="btn btn-ghost" style="margin-bottom:12px;padding:8px 14px" onclick="gPlanPg('minha-escala')">‹ Voltar</button>`}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-weight:900;font-size:18px;color:var(--text)">📆 Calendário</h2>
    ${isGestor?`<button class="btn btn-primary" style="padding:7px 12px;font-size:12px" onclick="openM('novaEscala')">+ Escalar</button>`:""}
  </div>
  <div class="card" style="padding:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="moveCal(-1)" style="background:var(--sf2);border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">‹</button>
      <div style="text-align:center"><div style="font-weight:900;font-size:17px;color:var(--text)">${mn[vm]}</div><div style="font-size:12px;color:var(--muted)">${vy}</div></div>
      <button onclick="moveCal(1)" style="background:var(--sf2);border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:6px">
      ${dn.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0">${d}</div>`).join("")}
    </div>
    <div class="cal-grid">
      ${cells.map(d=>{
        if(!d)return`<div></div>`;
        const de=escs.filter(e=>e.day===d);
        const has=de.length>0;
        const isT=isToday(d),iP=isPast(d);
        const dots=de.slice(0,3).map(e=>secOf(e.setorId)?.cor||"#1565C0");
        return`<div class="cal-day" onclick="openDay(${d},${vm},${vy})"
          style="background:${isT?"var(--blue)":has?"var(--tint-blue)":"var(--sf)"};border-color:${isT?"var(--blue)":has?"#BFDBFE":"transparent"}">
          <div style="font-size:12px;font-weight:${isT?"900":"600"};color:${isT?"#fff":iP?"var(--muted)":"var(--text)"}">${d}</div>
          ${has?`<div style="display:flex;gap:1px;margin-top:2px">${dots.map(c=>`<div style="width:5px;height:5px;border-radius:50%;background:${isT?"rgba(255,255,255,.8)":c}"></div>`).join("")}${de.length>3?`<div style="width:5px;height:5px;border-radius:50%;background:${isT?"rgba(255,255,255,.4)":"#ccc"}"></div>`:""}</div>`:""}
        </div>`;
      }).join("")}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Escalas de ${mn[vm]} (${escs.length})</div>
    ${escs.length===0?`<div style="color:var(--muted);text-align:center;padding:16px;font-size:13px">Nenhuma escala neste mês</div>`:
    [...escs].sort((a,b)=>a.day-b.day).map(e=>{
      const s=secOf(e.setorId),m=DB.med[e.medicoKey];
      return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sf)">
        <div style="width:36px;height:36px;border-radius:10px;background:${s?.cor||"var(--blue)"}18;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${s?.icone||"📅"}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px;color:var(--text)">${nm(m?.nome||e.medicoNome)}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(s?.nome||e.setorNome)} · Dia ${e.day}/${(vm+1).toString().padStart(2,"0")}</div>
          ${e.turno?`<span class="badge badge-blue" style="margin-top:3px">${esc(e.turno)}</span>`:""}
        </div>
        ${isGestor?`<button onclick="delEsc('${e.key}')" aria-label="Remover" style="background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px">×</button>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

window.moveCal=(d)=>{
  let m=(calM!=null?calM:new Date().getMonth())+d,y=calY||new Date().getFullYear();
  if(m>11){m=0;y++}if(m<0){m=11;y--}
  calM=m;calY=y;render();
};

window.openDay=function(day,month,year){
  const escs=Object.entries(DB.esc).map(([k,v])=>({...v,key:k})).filter(e=>e.day===day&&e.month===month&&e.year===year);
  const mn=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const meds=Object.entries(DB.med).map(([k,v])=>({...v,key:k})).filter(m=>m.role!=="gestor");
  const isGestor=U?.role==="gestor";

  openM("dayModal",null,{day,month,year,escs,mn,meds,isGestor});
};

function pMinhaEscala(){
  const now=new Date();

  const mn=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dn=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const fd=new Date(vy,vm,1).getDay();
  const dim=new Date(vy,vm+1,0).getDate();
  const today=new Date();
  const mine=Object.entries(DB.esc).map(([k,v])=>({...v,key:k})).filter(e=>e.medicoKey===U.key&&e.year===vy&&e.month===vm);

  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);
  const isToday=d=>d&&today.getFullYear()===vy&&today.getMonth()===vm&&today.getDate()===d;

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">

  </div>

    ${(()=>{const s=secOf(prox.setorId);const diffD=Math.ceil((new Date(prox.year,prox.month,prox.day)-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/(864e5));
    return`<div style="font-weight:900;font-size:20px;margin-bottom:6px">${diffD===0?"Hoje! 🔥":diffD===1?"Amanhã ⏰":`Em ${diffD} dias`}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:20px">${s?.icone||"🏥"}</span><span style="font-weight:700;font-size:14px">${esc(s?.nome||prox.setorNome)}</span></div>
    <div style="font-size:13px;opacity:.85">${prox.day.toString().padStart(2,"0")}/${(vm+1).toString().padStart(2,"0")}/${vy}</div>
    ${prox.turno?`<span style="margin-top:6px;background:rgba(255,255,255,.2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;display:inline-block">${esc(prox.turno)}</span>`:""}`;})()}
  </div>`:`<div style="background:var(--sf);border-radius:14px;padding:14px;margin-bottom:16px;text-align:center;color:var(--muted);font-size:13px">📭 Nenhum plantão agendado neste mês</div>`}

      <button onclick="moveMe(1)" style="background:var(--sf2);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">›</button>

      if(!d)return`<div></div>`;

      const cor=myE[0]?secOf(myE[0].setorId)?.cor||"var(--blue)":"var(--blue)";

        <div style="font-size:12px;font-weight:${has||isT?"800":"500"};color:${isT&&!has?"#fff":has?cor:iP?"var(--muted)":"var(--text)"}">${d}</div>

      </div>`;
    }).join("")}</div>

        <div style="width:46px;height:52px;border-radius:12px;background:${s?.cor||"var(--blue)"};display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 8px ${s?.cor||"var(--blue)"}44">
          <div style="color:rgba(255,255,255,.8);font-size:9px;font-weight:800">${dow}</div>
          <div style="color:#fff;font-size:22px;font-weight:900;line-height:1">${e.day}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px;color:var(--text)">${s?.icone||"🏥"} ${esc(s?.nome||e.setorNome)}</div>
          ${e.turno?`<span class="badge badge-blue" style="margin-top:3px">${esc(e.turno)}</span>`:""}
          ${e.obs?`<div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:3px">${esc(e.obs)}</div>`:""}
          ${isH?`<div style="font-size:11px;color:var(--blue);font-weight:700;margin-top:3px">🔥 HOJE</div>`:""}
        </div>
        <span class="${isH?"badge badge-green":isF?"badge badge-blue":"badge badge-gray"}">${isH?"HOJE":isF?"AGEND.":"PASSADO"}</span>
      </div>`;
    }).join("")}
  </div>
  </div>`;
}

window.moveMe=(d)=>{
  let m=(meM!=null?meM:new Date().getMonth())+d,y=meY||new Date().getFullYear();
  if(m>11){m=0;y++}if(m<0){m=11;y--}
  meM=m;meY=y;renderPlantonista();
};

window.encP=async(key)=>{
  const p=DB.plt[key];if(!p){toast("Plantão não encontrado","⚠️");return}
  const nome=p.medicoNome||"médico",setor=p.setorNome||"—";
  if(!confirm(`Encerrar plantão de ${nome}?`))return;
  const ok=await dbTry(update(ref(db,`plantoes/${key}`),{status:"encerrado",fim:new Date().toISOString()}));
  if(!ok)return;
  push(ref(db,"notificacoes"),{tipo:"fim",texto:`${nome} encerrou plantão em ${setor}`,hora:now(),ts:Date.now(),cor:"red"}).catch(()=>{});
  toast(`${nome.split(" ")[0]} encerrado`,"🔴");
};

window.iniciarPlt=async()=>{
  const jaAtivo=Object.values(DB.plt).some(p=>p.medicoKey===U.key&&p.status==="ativo");
  if(jaAtivo){toast("Você já tem um plantão ativo","⚠️");return}
  let s=SETORES.find(x=>x.nome===U.setor)||null;
  if(!s){ // setor do médico não bate com nenhum: deixa escolher na hora
    const lista=SETORES.map((x,i)=>`${i+1}) ${x.nome}`).join("\n");
    const r=prompt("Seu setor não está definido. Digite o número do setor deste plantão:\n\n"+lista);
    const idx=parseInt(r,10)-1;
    if(!(idx>=0&&idx<SETORES.length)){toast("Plantão não iniciado","⚠️");return}
    s=SETORES[idx];
  }
  beep("start");
  const ok=await dbTry(push(ref(db,"plantoes"),{medicoKey:U.key,medicoUid:U.uid||null,medicoNome:U.nome,medicoCrm:U.crm,setorId:s.id,setorNome:s.nome,status:"ativo",inicio:new Date().toISOString(),fim:null}));
  if(!ok)return;
  push(ref(db,"notificacoes"),{tipo:"inicio",texto:`${U.nome} iniciou plantão em ${s.nome}`,hora:now(),ts:Date.now(),cor:"green"}).catch(()=>{});
  toast("Plantão iniciado! Bom trabalho 💪","✅");
};

window.encerrarPlt=async key=>{
  if(!key)return;
  if(!confirm("Encerrar seu plantão agora?"))return;
  beep("end");
  const ok=await dbTry(update(ref(db,`plantoes/${key}`),{status:"encerrado",fim:new Date().toISOString()}));
  if(!ok)return;
  push(ref(db,"notificacoes"),{tipo:"fim",texto:`${U.nome} encerrou plantão`,hora:now(),ts:Date.now(),cor:"red"}).catch(()=>{});
  toast("Plantão encerrado! Bom descanso 🌙","🔴");
};

async function _uploadFoto(file,key,after){
  if(!file)return;
  if(file.size>MAX_FOTO){toast("Foto muito grande (máx 500KB)","⚠️");return}
  let dataUrl;
  try{dataUrl=await shrinkImg(file,FOTO_MAXPX)}
  catch(e){toast("Não foi possível processar a imagem","⚠️");return}
  const ok=await dbTry(update(ref(db,`medicos/${key}`),{foto:dataUrl}),"Foto atualizada!","📷");
  if(ok&&after)after(dataUrl);
}
window.uploadFoto=input=>_uploadFoto(input.files[0],U.key,dataUrl=>{
  U={...U,foto:dataUrl};sessionStorage.setItem("hemo_u",JSON.stringify(U));render();
});
window.uploadFotoMed=(key,input)=>_uploadFoto(input.files[0],key,()=>closeM());

window.editarSetor=(key,setor)=>dbTry(update(ref(db,`medicos/${key}`),{setor}),"Setor atualizado","🏥");

window.resetSenha=async(key)=>{
  const nome=DB.med[key]?.nome||"este médico";

window.gerarRel=tipo=>{
  const per=$("rel-per")?.value||"mes",fmt=$("rel-fmt")?.value||"csv";
  const now2=new Date();
  let desde,ate=null,rotulo,perTag=per;
  if(per==="mesesp"){
    const r=mesRange($("rel-mes")?.value);
    if(!r){toast("Escolha o mês","⚠️");return}
    desde=r.desde;ate=r.ate;rotulo=r.rotulo;perTag=$("rel-mes")?.value||"mes";
  }else{
    desde=periodoInicio(per,now2);
    rotulo={hoje:"hoje","7d":"últimos 7 dias",mes:"mês atual",tudo:"todo o período"}[per]||per;
  }
  const dentro=x=>{const t=x.inicio?new Date(x.inicio):null;return t&&!isNaN(t.getTime())&&t>=desde&&(!ate||t<ate)};
  const p=Object.values(DB.plt).filter(dentro);
  const m=Object.values(DB.med).filter(x=>x.role!=="gestor");
  const hoje=now2.toLocaleDateString("pt-BR");

  let head=[],rows=[];
  if(tipo==="chegada"){head=["Médico","CRM","Setor","Início"];
    rows=p.map(x=>[x.medicoNome,x.medicoCrm,x.setorNome,fmtDT(x.inicio)]);}
  else if(tipo==="fechamento"){head=["Médico","CRM","Setor","Início","Fim","Duração"];
    rows=p.filter(x=>x.fim).map(x=>[x.medicoNome,x.medicoCrm,x.setorNome,fmtDT(x.inicio),fmtDT(x.fim),dur(x.inicio,x.fim)]);}
  else if(tipo==="completo"){head=["Status","Médico","CRM","Setor","Início","Fim","Duração"];
    rows=p.map(x=>[x.status,x.medicoNome,x.medicoCrm,x.setorNome,fmtDT(x.inicio),fmtDT(x.fim),dur(x.inicio,x.fim)]);}
  else if(tipo==="ausencias"){head=["Médico","CRM","Setor"];
    const cp=new Set(p.map(x=>x.medicoKey));
    rows=m.filter(x=>!cp.has(x.key||`crm_${x.crm}`)).map(x=>[x.nome,x.crm,x.setor||"—"]);}

  let blob,ext;
  if(fmt==="csv"){
    const csv=[csvRow(head),...rows.map(r=>csvRow(r))].join("\r\n");
    blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});ext="csv";
  }else{
    const w=head.map(h=>h.length);rows.forEach(r=>r.forEach((c,i)=>w[i]=Math.max(w[i],String(c).length)));
    const fmtRow=r=>r.map((c,i)=>String(c).padEnd(w[i])).join("  ");
    const txt=[`RELATÓRIO ${tipo.toUpperCase()} — ${rotulo} (${hoje})`,"=".repeat(70),fmtRow(head),"-".repeat(70),...rows.map(fmtRow)].join("\n");
    blob=new Blob([txt],{type:"text/plain;charset=utf-8"});ext="txt";
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`relatorio_${tipo}_${perTag}_${hoje.replace(/\//g,"-")}.${ext}`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`Relatório gerado (${rows.length} linha${rows.length!==1?"s":""})`,"📊");
};

window.closeM=()=>{const mr=$("modal-root");if(mr)mr.innerHTML=""};

window.savePlantao=async()=>{
  const mk=$("mm")?.value,sk=$("ms")?.value;
  if(!mk||!sk){toast("Selecione médico e setor!","⚠️");return}
  const m=DB.med[mk],s=SETORES.find(x=>x.id===sk);
  if(Object.values(DB.plt).some(p=>p.medicoKey===mk&&p.status==="ativo")){toast("Esse médico já tem plantão ativo","⚠️");return}
  const ok=await dbTry(push(ref(db,"plantoes"),{medicoKey:mk,medicoUid:DB.med[mk]?.uid||null,medicoNome:m.nome,medicoCrm:m.crm,setorId:sk,setorNome:s.nome,status:"ativo",inicio:new Date().toISOString(),fim:null}),`${m.nome.split(" ")[0]} iniciado!`,"✅");
  if(!ok)return;
  push(ref(db,"notificacoes"),{tipo:"inicio",texto:`${m.nome} iniciou plantão em ${s.nome}`,hora:now(),ts:Date.now(),cor:"green"}).catch(()=>{});
  closeM();
};

window.saveMed=async()=>{
  const n=$("mn")?.value.trim(),c=$("mc")?.value.trim();
  if(!n||!c){toast("Nome e CRM obrigatórios!","⚠️");return}
  if(!/^\d+$/.test(c)){toast("CRM deve conter só números","⚠️");return}
  if(DB.med[`crm_${c}`]&&!confirm(`Já existe médico com CRM ${c}. Sobrescrever o cadastro?`))return;
  const ok=await dbTry(set(ref(db,`medicos/crm_${c}`),{crm:c,nome:n,matricula:$("mmat")?.value||"",funcao:"Médico(a)",setor:$("mset")?.value||"",role:"plantonista",senha:await sha256Hex($("msen")?.value||"1234"),foto:""}),`${n.split(" ")[0]} cadastrado!`,"✅");
  if(ok)closeM();
};

window.saveAnun=async()=>{
  const t=$("at")?.value.trim(),x=$("ax")?.value.trim();
  if(!t||!x){toast("Preencha título e mensagem!","⚠️");return}
  const ok=await dbTry(push(ref(db,"anuncios"),{titulo:t,texto:x,cor:$("ac")?.value||"#2196F3",hora:now(),ts:Date.now(),autor:U.nome}),"Anúncio publicado!","📢");
  if(ok)closeM();
};

window.saveEsc=async(day,month,year)=>{
  const dp=$("dpick")?.value;
  if(dp){const d=new Date(dp+"T12:00:00");if(!isNaN(d.getTime())){day=d.getDate();month=d.getMonth();year=d.getFullYear();}}
  const mk=$("dm")?.value,sk=$("ds")?.value;
  if(!mk||!sk){toast("Selecione médico e setor!","⚠️");return}
  const m=DB.med[mk],s=SETORES.find(x=>x.id===sk);
  const base={medicoKey:mk,medicoUid:DB.med[mk]?.uid||null,medicoNome:m.nome,medicoCrm:m.crm,setorId:sk,setorNome:s.nome,turno:$("dt")?.value||"",obs:$("do")?.value||"",criadoPor:U.nome,criadoEm:now(),ts:Date.now()};
  const alvos=[{day,month,year}];
  if($("drep")?.checked)diasRepetidos(day,month,year).forEach(dd=>alvos.push({day:dd,month,year}));
  let ok=0;
  for(const t of alvos){if(await dbTry(push(ref(db,"escalas"),{...base,...t})))ok++;}
  if(ok)toast(ok>1?`${ok} plantões escalados`:`${String(m.nome).split(" ")[0]} escalado para dia ${day}`,"📅");
  closeM();openDay(day,month,year);
};

window.savePass=async()=>{
  const a=$("sa")?.value,n=$("sn")?.value,c=$("sc")?.value,err=$("serr");
  const fail=t=>{if(err){err.style.display="block";err.textContent=t}};
  if(!(await senhaConfere(a,U.senha)))return fail("Senha atual incorreta.");
  if(n!==c)return fail("As senhas não coincidem.");
  if(!n||n.length<4)return fail("Mínimo 4 caracteres.");
  const h=await sha256Hex(n);
  const ok=await dbTry(update(ref(db,`medicos/${U.key}`),{senha:h}),"Senha alterada!","🔐");
  if(!ok)return;
  U={...U,senha:h};sessionStorage.setItem("hemo_u",JSON.stringify(U));
  closeM();
};

      <div id="imp-bar" style="height:100%;background:linear-gradient(90deg,#7B1FA2,#4CAF50);border-radius:4px;width:0%;transition:width .3s"></div>
    </div>

    <button id="imp-btn1" class="btn btn-primary" style="width:100%;margin-bottom:10px;padding:14px;font-size:15px;background:linear-gradient(135deg,#7B1FA2,#9C27B0)" onclick="runImport()">
      📥 Importar 194 Plantões no Calendário
    </button>
    <button id="imp-btn2" class="btn btn-ghost" style="width:100%;padding:12px;font-size:13px;display:none" onclick="limparImport()">
      🗑️ Apagar escalas de Agosto importadas
    </button>

    <div id="imp-log" style="background:#0F172A;color:#4ADE80;border-radius:10px;padding:14px;font-family:monospace;font-size:11px;height:200px;overflow-y:auto;margin-top:12px;display:none"></div>
  </div>`;
}

window.runImport = async function(){
  const btn=$("imp-btn1"),logEl=$("imp-log"),prog=$("imp-prog"),bar=$("imp-bar");
  if(btn){btn.disabled=true;btn.textContent="Carregando dados...";}
  if(logEl)logEl.style.display="block";
  if(prog)prog.style.display="block";

  function ilog(msg,cor="#4ADE80"){
    if(!logEl)return;
    logEl.innerHTML+=`<span style="color:${cor}">${msg}</span>\n`;
    logEl.scrollTop=logEl.scrollHeight;
  }

  ilog("📡 Carregando dados da escala...");

  // Carrega o JSON: arquivo local primeiro, GitHub como fallback
  let entries=[], newMeds={};
  try{
    let data;
    try{
      const rl=await fetch("./escalas_agosto2026.json",{cache:"no-store"});
      if(!rl.ok)throw new Error("HTTP "+rl.status);
      data=await rl.json();
      ilog("✅ Arquivo local encontrado");
    }catch(le){
      ilog("… local indisponível, tentando GitHub…","#FCD34D");
      const r1=await fetch("https://raw.githubusercontent.com/pediupabancarios/hemocentro-plantoes/main/escalas_agosto2026.json");
      if(!r1.ok)throw new Error("HTTP "+r1.status);
      data=await r1.json();
    }
    entries=data.entries||[];
    newMeds=data.newMeds||{};
    ilog(`✅ ${entries.length} plantões carregados`);
  }catch(err){
    ilog("❌ Erro ao carregar dados: "+err.message,"#F87171");
    ilog("Verifique se escalas_agosto2026.json está na pasta do app ou no GitHub","#FCD34D");
    if(btn){btn.disabled=false;btn.textContent="📥 Tentar novamente";}
    return;
  }

  // Step 1: cadastrar novos médicos
  ilog("\n👥 Cadastrando novos médicos...");
  for(const [key,med] of Object.entries(newMeds)){
    const snap=await get(ref(db,`medicos/${key}`));
    if(!snap.exists()){
      await set(ref(db,`medicos/${key}`),med);
      ilog(`✅ ${med.nome.split(" ").slice(0,2).join(" ")} cadastrado`);
    }else{
      ilog(`⚠️ CRM ${med.crm} já existe`,"#FCD34D");
    }
  }

  // Step 2: import entries
  ilog(`\n🗓️ Importando ${entries.length} plantões...`);
  let ok=0,erros=0;
  for(let i=0;i<entries.length;i++){
    try{
      await push(ref(db,"escalas"),{...entries[i],ts:Date.now()});
      ok++;
      if(ok%25===0||ok===entries.length){
        ilog(`📅 ${ok}/${entries.length} importados`);
        if(bar)bar.style.width=Math.round((ok/entries.length)*100)+"%";
      }
    }catch(err){erros++;}
    await new Promise(r=>setTimeout(r,IMPORT_DELAY));
  }
  if(erros)ilog(`⚠️ ${erros} falharam (permissão/rede)`,"#FCD34D");
  if(bar)bar.style.width="100%";
  ilog(`\n🎉 CONCLUÍDO! ${ok} plantões importados!`,"#FCD34D");
  ilog("Acesse Calendário → Agosto 2026 📆","#93C5FD");
  if(btn)btn.textContent="✅ Importado!";
  const btn2=$("imp-btn2");
  if(btn2)btn2.style.display="block";
  toast("194 plantões importados!","📥");
};

window.limparImport = async function(){
  if(!confirm("Apagar escalas de Agosto 2026 importadas?"))return;
  const snap=await get(ref(db,"escalas"));
  const all=snap.val()||{};
  let count=0;
  for(const [key,val] of Object.entries(all)){
    if(val.month===7&&val.year===2026&&val.obs?.includes("Escala oficial")){
      await remove(ref(db,`escalas/${key}`));
      count++;
    }
  }
  toast(`${count} escalas removidas`,"🗑️");
};

// ─────────────────────────────────────
// CLOCK
// ─────────────────────────────────────
function startClock(){
  stopClock();
  clockT=setInterval(()=>{
    const cl=$("clock");if(cl)cl.textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});else{stopClock();return}
    const dl=$("dur-live");
    if(dl){const a=Object.entries(DB.plt).map(([k,v])=>({...v,key:k})).find(p=>p.medicoKey===U?.key&&p.status==="ativo");if(a)dl.textContent=dur(a.inicio,null);}
  },1000);
}
function stopClock(){if(clockT){clearInterval(clockT);clockT=null}}

// ─────────────────────────────────────
// INIT
// ─────────────────────────────────────
async function init(){
  applyTheme();
  render();            // login ou skeleton, imediato
  await seed();
  if(AUTH_MODE==="firebase"&&fbAuth){
    onAuthStateChanged(fbAuth,async user=>{
      if(!user){U=null;dataLoaded=false;uns.forEach(u=>u());uns=[];sessionStorage.removeItem("hemo_u");render();return}
      if(!U||U.uid!==user.uid){
        let d=null,key=null;
        try{
          const q=await get(query(ref(db,"medicos"),orderByChild("uid"),equalTo(user.uid)));
          if(q.exists()){const o=q.val();key=Object.keys(o)[0];d=o[key];}
        }catch(e){}
        U={...(d||{}),key,uid:user.uid,gestor:!!(await user.getIdTokenResult()).claims.gestor};
        if(U.gestor)U.role="gestor";
        sessionStorage.setItem("hemo_u",JSON.stringify(U));
      }
      lastNotifTs=0;dataLoaded=false;document.body.style.background="var(--bg)";listen();
    });
    return;
  }
  if(U)listen();
}
init();

// ── PWA service worker ──
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
