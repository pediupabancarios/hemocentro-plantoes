<style>
:root{
  --red:#C62828;--red-light:#FFEBEE;--red-dark:#B71C1C;
  --blue:#1565C0;--blue-light:#E3F2FD;--blue-mid:#1976D2;
  --green:#2E7D32;--green-light:#E8F5E9;
  --orange:#E65100;--orange-light:#FFF3E0;
  --purple:#6A1B9A;--purple-light:#F3E5F5;
  --teal:#00695C;--teal-light:#E0F2F1;
  --bg:#F4F6FA;--card:#fff;--border:#E8EDF5;
  --text:#0F172A;--sub:#64748B;--muted:#94A3B8;
  --radius:16px;--shadow:0 2px 16px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── SHELL ── */
#app{display:flex;height:100vh;overflow:hidden}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;backdrop-filter:blur(4px)}
#overlay.on{display:block}
#sidebar{
  position:fixed;top:0;left:0;height:100vh;width:264px;
  background:linear-gradient(180deg,#0a1628 0%,#0D1B2A 100%);
  display:flex;flex-direction:column;z-index:101;
  transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;overflow-x:hidden;
}
#sidebar.on{transform:translateX(0)}
@media(min-width:768px){
  #sidebar{position:relative;transform:translateX(0)!important;flex-shrink:0}
  #overlay{display:none!important}
  #hambtn{display:none!important}
}
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{
  background:var(--card);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;height:58px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  box-shadow:0 1px 8px rgba(0,0,0,.06);position:relative;z-index:10;
}
#page{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-in{animation:fadeUp .22s ease forwards}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{font-weight:700;font-size:15px;color:var(--text);margin-bottom:14px}

/* ── SIDEBAR NAV ── */
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;border:none;width:100%;text-align:left;font-size:14px;font-weight:600;margin-bottom:2px;background:transparent;color:#7B8FA6;cursor:pointer;transition:all .15s;font-family:inherit}
.nav-item:hover{background:#1a2d42;color:#fff}
.nav-item.on{background:linear-gradient(135deg,var(--blue),var(--blue-mid));color:#fff;box-shadow:0 4px 14px rgba(21,101,192,.35)}
.nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-badge{background:#EF5350;color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:800;margin-left:auto}

/* ── BUTTONS ── */
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-mid));color:#fff;box-shadow:0 3px 12px rgba(21,101,192,.3)}
.btn-danger{background:var(--red-light);color:var(--red)}
.btn-success{background:var(--green-light);color:var(--green)}
.btn-ghost{background:#F1F5F9;color:#475569}
.btn-full{width:100%;padding:15px;font-size:15px;border-radius:14px}
.btn-green-full{background:linear-gradient(135deg,var(--green),#388E3C);color:#fff;box-shadow:0 4px 14px rgba(46,125,50,.3)}
.btn-red-full{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;box-shadow:0 4px 14px rgba(198,40,40,.3)}
.btn-disabled{background:#E2E8F0!important;color:#94A3B8!important;cursor:not-allowed!important;box-shadow:none!important}

/* ── BADGES ── */
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-gray{background:#F1F5F9;color:#64748B}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.live{display:inline-flex;align-items:center;gap:5px;background:var(--green-light);color:var(--green);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid #F1F5F9;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:11px 10px;font-size:13px;color:var(--text);vertical-align:middle;border-bottom:1px solid #F8FAFC}
tr:last-child td{border-bottom:none}
tr{transition:background .1s}
tbody tr:hover{background:#FAFBFF}

/* ── INPUTS ── */
label{display:block;font-weight:600;font-size:12px;color:var(--sub);margin-bottom:6px;margin-top:14px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;border:2px solid var(--border);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;font-family:inherit;background:#fff;color:var(--text);transition:border .2s,box-shadow .2s;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;touch-action:manipulation;display:block;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.12)}
textarea{resize:none;line-height:1.6}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px);padding:0}
@media(min-width:500px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:500px;box-shadow:var(--shadow-lg);animation:slideUp .28s cubic-bezier(.4,0,.2,1);max-height:92vh;display:flex;flex-direction:column}
@media(min-width:500px){.modal{border-radius:20px;animation:popIn .22s ease;max-height:85vh}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:12px auto 0;flex-shrink:0}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-body{padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-title{font-weight:800;font-size:17px;color:var(--text)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:4px}

/* ── TOAST ── */
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:500;pointer-events:none;transition:opacity .3s}
.toast-body{background:#0F172A;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:90vw}

/* ── AVATAR ── */
.av{border-radius:50%;object-fit:cover;flex-shrink:0}
.av-ini{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border-radius:50%;flex-shrink:0}

/* ── SECTOR CARD ── */
.sec-card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s}
.sec-card:active{transform:scale(.97)}

/* ── STAT CARD ── */
.stat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F8FAFC}
.stat:last-child{border-bottom:none}

/* ── BOTTOM NAV ── */
#bnav{display:flex;background:var(--card);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 2px 7px;border:none;background:none;cursor:pointer;font-size:9px;font-weight:700;color:var(--muted);gap:3px;transition:color .15s;touch-action:manipulation;font-family:inherit;position:relative}
.bnav-btn.on{color:var(--blue)}
.bnav-icon{font-size:21px;transition:transform .15s}
.bnav-btn.on .bnav-icon{transform:scale(1.12)}
.bnav-dot{position:absolute;top:6px;right:calc(50% - 14px);width:8px;height:8px;background:#EF5350;border-radius:50%;border:2px solid #fff}

/* ── SKELETON LOADER ── */
.skel{background:linear-gradient(90deg,#F1F5F9 25%,#E2E8F0 50%,#F1F5F9 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}

/* ── PONTO WIDGET ── */
.ponto-hero{border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.ponto-top{padding:18px 20px;background:linear-gradient(135deg,#0a1628 0%,#1565C0 100%)}
.ponto-bottom{background:#fff;padding:16px}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0a1628 0%,#1565C0 55%,#0a1628 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-card{background:#fff;border-radius:24px;padding:32px 26px;width:100%;max-width:400px;box-shadow:0 28px 80px rgba(0,0,0,.4)}
.inp-wrap{position:relative;margin-bottom:14px}
.inp-wrap input{padding-left:44px}
.inp-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}

/* ── REPORT CARD ── */
.report-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-bottom:10px;cursor:pointer;transition:all .15s;touch-action:manipulation}
.report-card:active{transform:scale(.97)}
.report-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}

/* ── CALENDAR ── */
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;touch-action:manipulation;transition:all .12s;border:2px solid transparent}
.cal-day:active{transform:scale(.92)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

/* ── NOTIF ITEM ── */
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-ico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
</style>

// ── UTILS ──

const fmtD=ts=>{try{return new Date(ts).toLocaleDateString("pt-BR")}catch{return"—"}};

const dur=(i,f)=>{
  if(!i)return"—";
  const m=Math.round((new Date(f||Date.now())-new Date(i))/60000);
  if(m<1)return"<1min";
  return m<60?m+"min":Math.floor(m/60)+"h"+(m%60?" "+m%60+"min":"");

// ── TOAST ──
let _toastT;
function toast(msg,emoji="✅",ms=3000){
  const el=$("toast");if(!el)return;
  el.innerHTML=`<div class="toast-body">${emoji} ${msg}</div>`;
  el.style.opacity="1";clearTimeout(_toastT);
  _toastT=setTimeout(()=>{el.style.opacity="0";setTimeout(()=>{if(el)el.innerHTML=""},300)},ms);
}

// ── SOUND ──
function beep(type){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const t=audioCtx.currentTime;
    if(type==="start"){
      o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.1);o.frequency.setValueAtTime(784,t+.2);
      g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.start(t);o.stop(t+.5);
    }else if(type==="end"){
      o.frequency.setValueAtTime(784,t);o.frequency.setValueAtTime(523,t+.15);
      g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.start(t);o.stop(t+.5);
    }else{
      o.frequency.setValueAtTime(440,t);
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
      o.start(t);o.stop(t+.25);
    }
  }catch(e){}
  try{if(type==="start")navigator.vibrate&&navigator.vibrate([80,40,80]);
    else if(type==="end")navigator.vibrate&&navigator.vibrate([150]);}catch(e){}
}

  uns.push(onValue(ref(db,"plantoes"),s=>{DB.plt=s.val()||{};render()}));
  uns.push(onValue(ref(db,"notificacoes"),s=>{
    const v=s.val()||{};
    const c=Object.keys(v).length;
    if(c>lastNotif&&lastNotif>0){const last=Object.values(v).pop();beep("notif");toast(last?.texto||"Nova notificação","🔔")}
    lastNotif=c;DB.notif=v;render();
  }));
  uns.push(onValue(ref(db,"anuncios"),s=>{DB.anun=s.val()||{};render()}));
  uns.push(onValue(ref(db,"escalas"),s=>{DB.esc=s.val()||{};render()}));
}

}

      <div id="lerr" style="display:none;background:var(--red-light);color:var(--red);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:center"></div>

      </button>

      </div>

  </div>`;
  const lcrm=$("lcrm"),lsen=$("lsen");
  if(lcrm){
    lcrm.addEventListener("keydown",e=>e.key==="Enter"&&lsen?.focus());
    lcrm.addEventListener("touchstart",()=>lcrm.focus(),{passive:true});
    setTimeout(()=>lcrm.focus(),120);

  }

window.doLogin=async function(){
  const crm=($("lcrm")||{}).value?.trim(),sen=($("lsen")||{}).value?.trim();
  const err=$("lerr"),btn=$("lbtn");
  if(!crm||!sen){if(err){err.style.display="block";err.textContent="⚠ Preencha CRM e senha.";}return}
  if(err)err.style.display="none";
  if(btn){btn.textContent="Verificando...";btn.disabled=true;}
  try{
    const snap=await get(ref(db,`medicos/crm_${crm}`));
    if(!snap.exists()){if(err){err.style.display="block";err.textContent="⚠ CRM não encontrado.";}if(btn){btn.textContent="Entrar no Sistema";btn.disabled=false;}return}
    const d=snap.val();
    if(d.senha!==sen){if(err){err.style.display="block";err.textContent="⚠ Senha incorreta.";}if(btn){btn.textContent="Entrar no Sistema";btn.disabled=false;}return}
    U={...d,key:`crm_${crm}`};
    sessionStorage.setItem("hemo_u",JSON.stringify(U));
    lastNotif=0;document.body.style.background="var(--bg)";
    listen();
  }catch(e){if(err){err.style.display="block";err.textContent="⚠ Erro de conexão."}if(btn){btn.textContent="Entrar no Sistema";btn.disabled=false;}}
};

window.doLogout=function(){
  U=null;pg="dashboard";
  sessionStorage.removeItem("hemo_u");
  stopClock();uns.forEach(u=>u());uns=[];
  document.body.style.background="#0a1628";
  render();
};

function pgCal(){
  const now=new Date();
  const vy=calY!=null?calY:now.getFullYear();
  const vm=calM!=null?calM:now.getMonth();
  calY=vy;calM=vm;
  const mn=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dn=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const fd=new Date(vy,vm,1).getDay();
  const dim=new Date(vy,vm+1,0).getDate();
  const today=new Date();
  const isGestor=U?.role==="gestor";
  const escs=Object.entries(DB.esc).map(([k,v])=>({...v,key:k})).filter(e=>e.year===vy&&e.month===vm);

  let cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);

  const isToday=d=>d&&today.getFullYear()===vy&&today.getMonth()===vm&&today.getDate()===d;
  const isPast=d=>d&&new Date(vy,vm,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());

  return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-weight:900;font-size:18px;color:var(--text)">📆 Calendário</h2>
    ${isGestor?`<button class="btn btn-primary" style="padding:7px 12px;font-size:12px" onclick="openM('novaEscala')">+ Escalar</button>`:""}
  </div>
  <div class="card" style="padding:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="moveCal(-1)" style="background:#F1F5F9;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">‹</button>
      <div style="text-align:center"><div style="font-weight:900;font-size:17px;color:var(--text)">${mn[vm]}</div><div style="font-size:12px;color:var(--muted)">${vy}</div></div>
      <button onclick="moveCal(1)" style="background:#F1F5F9;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:6px">
      ${dn.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0">${d}</div>`).join("")}
    </div>
    <div class="cal-grid">
      ${cells.map(d=>{
        if(!d)return`<div></div>`;
        const de=escs.filter(e=>e.day===d);
        const has=de.length>0;
        const isT=isToday(d),iP=isPast(d);
        const dots=de.slice(0,3).map(e=>secOf(e.setorId)?.cor||"#1565C0");
        return`<div class="cal-day" onclick="openDay(${d},${vm},${vy})"
          style="background:${isT?"var(--blue)":has?"#EFF6FF":"#F8FAFC"};border-color:${isT?"var(--blue)":has?"#BFDBFE":"transparent"}">
          <div style="font-size:12px;font-weight:${isT?"900":"600"};color:${isT?"#fff":iP?"var(--muted)":"var(--text)"}">${d}</div>
          ${has?`<div style="display:flex;gap:1px;margin-top:2px">${dots.map(c=>`<div style="width:5px;height:5px;border-radius:50%;background:${isT?"rgba(255,255,255,.8)":c}"></div>`).join("")}${de.length>3?`<div style="width:5px;height:5px;border-radius:50%;background:${isT?"rgba(255,255,255,.4)":"#ccc"}"></div>`:""}</div>`:""}
        </div>`;
      }).join("")}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Escalas de ${mn[vm]} (${escs.length})</div>
    ${escs.length===0?`<div style="color:var(--muted);text-align:center;padding:16px;font-size:13px">Nenhuma escala neste mês</div>`:
    [...escs].sort((a,b)=>a.day-b.day).map(e=>{
      const s=secOf(e.setorId),m=DB.med[e.medicoKey];
      return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F8FAFC">
        <div style="width:36px;height:36px;border-radius:10px;background:${s?.cor||"var(--blue)"}18;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${s?.icone||"📅"}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px;color:var(--text)">${(m?.nome||e.medicoNome).split(" ").slice(0,3).join(" ")}</div>
          <div style="font-size:12px;color:var(--muted)">${s?.nome||e.setorNome} · Dia ${e.day}/${(vm+1).toString().padStart(2,"0")}</div>
          ${e.turno?`<span class="badge badge-blue" style="margin-top:3px">${e.turno}</span>`:""}
        </div>
        ${isGestor?`<button onclick="delEsc('${e.key}')" style="background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px">×</button>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

window.moveCal=(d)=>{
  let m=(calM!=null?calM:new Date().getMonth())+d,y=calY||new Date().getFullYear();
  if(m>11){m=0;y++}if(m<0){m=11;y--}
  calM=m;calY=y;render();
};

  const meds=Object.entries(DB.med).map(([k,v])=>({...v,key:k})).filter(m=>m.role!=="gestor");

  openM("dayModal",null,{day,month,year,escs,mn,meds,isGestor});
};

      ].map(b=>`<button class="bnav-btn ${pg===b.id?"on":""}" onclick="gPlanPg('${b.id}')">

function pMinhaEscala(){
  const now=new Date();
  const vy=meY!=null?meY:now.getFullYear();
  const vm=meM!=null?meM:now.getMonth();
  meY=vy;meM=vm;
  const mn=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const dn=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const fd=new Date(vy,vm,1).getDay();
  const dim=new Date(vy,vm+1,0).getDate();
  const today=new Date();
  const mine=Object.entries(DB.esc).map(([k,v])=>({...v,key:k})).filter(e=>e.medicoKey===U.key&&e.year===vy&&e.month===vm);
  const dias=new Set(mine.map(e=>e.day));
  const prox=mine.filter(e=>new Date(e.year,e.month,e.day)>=new Date(today.getFullYear(),today.getMonth(),today.getDate())).sort((a,b)=>a.day-b.day)[0];
  let cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);
  const isToday=d=>d&&today.getFullYear()===vy&&today.getMonth()===vm&&today.getDate()===d;
  const isPast=d=>d&&new Date(vy,vm,d)<new Date(today.getFullYear(),today.getMonth(),today.getDate());
  return`<div style="padding:16px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <h2 style="font-weight:900;font-size:18px;color:var(--text)">🗓️ Minha Escala</h2>
    <span class="badge badge-blue">${mine.length} plantão${mine.length!==1?"es":""}</span>
  </div>
  ${prox?`<div style="background:linear-gradient(135deg,#1565C0,#7B1FA2);border-radius:16px;padding:16px;margin-bottom:16px;color:#fff">
    <div style="font-size:11px;opacity:.7;font-weight:700;margin-bottom:4px">PRÓXIMO PLANTÃO</div>
    ${(()=>{const s=secOf(prox.setorId);const diffD=Math.ceil((new Date(prox.year,prox.month,prox.day)-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/(864e5));
    return`<div style="font-weight:900;font-size:20px;margin-bottom:6px">${diffD===0?"Hoje! 🔥":diffD===1?"Amanhã ⏰":`Em ${diffD} dias`}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:20px">${s?.icone||"🏥"}</span><span style="font-weight:700;font-size:14px">${s?.nome||prox.setorNome}</span></div>
    <div style="font-size:13px;opacity:.85">${prox.day.toString().padStart(2,"0")}/${(vm+1).toString().padStart(2,"0")}/${vy}</div>
    ${prox.turno?`<span style="margin-top:6px;background:rgba(255,255,255,.2);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;display:inline-block">${prox.turno}</span>`:""}`;})()}
  </div>`:`<div style="background:#F8FAFC;border-radius:14px;padding:14px;margin-bottom:16px;text-align:center;color:var(--muted);font-size:13px">📭 Nenhum plantão agendado neste mês</div>`}
  <div class="card" style="padding:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button onclick="moveMe(-1)" style="background:#F1F5F9;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">‹</button>
      <span style="font-weight:900;font-size:15px;color:var(--text)">${mn[vm]} ${vy}</span>
      <button onclick="moveMe(1)" style="background:#F1F5F9;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;touch-action:manipulation">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:6px">${dn.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:3px">${d}</div>`).join("")}</div>
    <div class="cal-grid">${cells.map(d=>{
      if(!d)return`<div></div>`;
      const has=dias.has(d),isT=isToday(d),iP=isPast(d);
      const myE=mine.filter(e=>e.day===d);
      const cor=myE[0]?secOf(myE[0].setorId)?.cor||"var(--blue)":"var(--blue)";
      return`<div class="cal-day" onclick="openMeuDia(${d},${vm},${vy})"
        style="background:${has?cor+"22":isT?"var(--blue)":"#F8FAFC"};border-color:${has?cor:isT?"var(--blue)":"transparent"}">
        <div style="font-size:12px;font-weight:${has||isT?"800":"500"};color:${isT&&!has?"#fff":has?cor:iP?"var(--muted)":"var(--text)"}">${d}</div>
        ${has?`<div style="width:5px;height:5px;border-radius:50%;background:${cor};margin-top:1px"></div>`:""}
      </div>`;
    }).join("")}</div>
  </div>
  <div class="card">
    <div class="card-title">Todos os Plantões</div>
    ${mine.length===0?`<div style="text-align:center;padding:24px;color:var(--muted)"><div style="font-size:36px;margin-bottom:8px">📭</div>Nenhum plantão escalado</div>`:
    [...mine].sort((a,b)=>a.day-b.day).map(e=>{
      const s=secOf(e.setorId),d=new Date(e.year,e.month,e.day);
      const dow=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()];
      const isH=e.day===today.getDate()&&e.month===today.getMonth()&&e.year===today.getFullYear();
      const isF=d>=new Date(today.getFullYear(),today.getMonth(),today.getDate());
      return`<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;margin-bottom:8px;background:${isH?"linear-gradient(135deg,#1565C020,#1565C010)":"#F8FAFC"};border:1.5px solid ${isH?"#BFDBFE":"var(--border)"}">
        <div style="width:46px;height:52px;border-radius:12px;background:${s?.cor||"var(--blue)"};display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 8px ${s?.cor||"var(--blue)"}44">
          <div style="color:rgba(255,255,255,.8);font-size:9px;font-weight:800">${dow}</div>
          <div style="color:#fff;font-size:22px;font-weight:900;line-height:1">${e.day}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px;color:var(--text)">${s?.icone||"🏥"} ${s?.nome||e.setorNome}</div>
          ${e.turno?`<span class="badge badge-blue" style="margin-top:3px">${e.turno}</span>`:""}
          ${e.obs?`<div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:3px">${e.obs}</div>`:""}
          ${isH?`<div style="font-size:11px;color:var(--blue);font-weight:700;margin-top:3px">🔥 HOJE</div>`:""}
        </div>
        <span class="${isH?"badge badge-green":isF?"badge badge-blue":"badge badge-gray"}">${isH?"HOJE":isF?"AGEND.":"PASSADO"}</span>
      </div>`;
    }).join("")}
  </div>
  </div>`;
}

window.moveMe=(d)=>{
  let m=(meM!=null?meM:new Date().getMonth())+d,y=meY||new Date().getFullYear();
  if(m>11){m=0;y++}if(m<0){m=11;y--}
  meM=m;meY=y;renderPlantonista();
};

window.encP=async(key,nome,setor)=>{
  if(!confirm(`Encerrar plantão de ${nome}?`))return;
  await update(ref(db,`plantoes/${key}`),{status:"encerrado",fim:new Date().toISOString()});
  await push(ref(db,"notificacoes"),{tipo:"fim",texto:`${nome} encerrou plantão em ${setor}`,hora:now(),cor:"red"});
  toast(`${nome.split(" ")[0]} encerrado`,"🔴");
};

window.iniciarPlt=async()=>{
  beep("start");
  await push(ref(db,"plantoes"),{medicoKey:U.key,medicoNome:U.nome,medicoCrm:U.crm,setorId:null,setorNome:U.setor||"A definir",status:"ativo",inicio:new Date().toISOString(),fim:null});
  await push(ref(db,"notificacoes"),{tipo:"inicio",texto:`${U.nome} iniciou plantão em ${U.setor||"setor a definir"}`,hora:now(),cor:"green"});
  toast("Plantão iniciado! Bom trabalho 💪","✅");
};

window.encerrarPlt=async key=>{
  if(!key)return;
  beep("end");
  await update(ref(db,`plantoes/${key}`),{status:"encerrado",fim:new Date().toISOString()});
  await push(ref(db,"notificacoes"),{tipo:"fim",texto:`${U.nome} encerrou plantão`,hora:now(),cor:"red"});
  toast("Plantão encerrado! Bom descanso 🌙","🔴");

window.gerarRel=plts=>{
  const p=Object.values(DB.plt),m=Object.values(DB.med).filter(x=>x.role!=="gestor");
  const hoje=new Date().toLocaleDateString("pt-BR");
  let lines=[];
  if(plts==="chegada")lines=["RELATÓRIO DE CHEGADA — "+hoje,"=".repeat(60),...p.map(x=>`${x.medicoNome} | CRM ${x.medicoCrm} | ${x.setorNome} | ${fmtDT(x.inicio)}`)];
  else if(plts==="fechamento")lines=["RELATÓRIO DE FECHAMENTO — "+hoje,"=".repeat(60),...p.filter(x=>x.fim).map(x=>`${x.medicoNome} | CRM ${x.medicoCrm} | ${x.setorNome} | ${fmtDT(x.inicio)} → ${fmtDT(x.fim)} | ${dur(x.inicio,x.fim)}`)];
  else if(plts==="completo"){lines=["RELATÓRIO COMPLETO","=".repeat(60)];p.forEach(x=>{lines.push(`[${x.status.toUpperCase()}] ${x.medicoNome} | CRM ${x.medicoCrm}`);lines.push(`  Setor: ${x.setorNome} | Início: ${fmtDT(x.inicio)} | Fim: ${fmtDT(x.fim)} | ${dur(x.inicio,x.fim)}`);lines.push("")});}
  else if(plts==="ausencias"){const cp=new Set(p.map(x=>x.medicoKey));lines=["RELATÓRIO DE AUSÊNCIAS — "+hoje,"=".repeat(60),...m.filter(x=>!cp.has(x.key||`crm_${x.crm}`)).map(x=>`${x.nome} | CRM ${x.crm}`)];}
  const b=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`relatorio_${plts}_${hoje.replace(/\//g,"-")}.txt`;a.click();
  toast("Relatório gerado!","📊");
};

window.runImport = async function(mes){
  const logEl=$("imp-log"),prog=$("imp-prog"),bar=$("imp-bar");
  if(logEl)logEl.style.display="block";
  if(prog)prog.style.display="block";

  function ilog(msg,cor="#4ADE80"){
    if(!logEl)return;
    logEl.innerHTML+=`<span style="color:${cor}">${msg}</span>\n`;
    logEl.scrollTop=logEl.scrollHeight;
  }

  const arquivo = mes==="setembro"
    ? "escalas_setembro2026.json"
    : "escalas_agosto2026.json";
  const label = mes==="setembro" ? "Setembro" : "Agosto";

  ilog(`📡 Carregando escala de ${label}...`);

  let entries=[], newMeds={};
  try{
    const r1=await fetch(`https://raw.githubusercontent.com/pediupabancarios/hemocentro-plantoes/main/${arquivo}`);
    if(!r1.ok) throw new Error("Arquivo não encontrado no GitHub (status "+r1.status+")");
    const data=await r1.json();
    entries=data.entries||[];
    newMeds=data.newMeds||{};
    ilog(`✅ ${entries.length} plantões carregados`);
  }catch(err){
    ilog("❌ Erro: "+err.message,"#F87171");
    ilog("Verifique se o arquivo "+arquivo+" está no GitHub","#FCD34D");
    return;
  }

  // Cadastrar novos médicos
  if(Object.keys(newMeds).length>0){
    ilog("\n👥 Cadastrando novos médicos...");
    for(const [key,med] of Object.entries(newMeds)){
      const snap=await get(ref(db,`medicos/${key}`));
      if(!snap.exists()){
        await set(ref(db,`medicos/${key}`),med);
        ilog(`✅ ${med.nome.split(" ").slice(0,2).join(" ")} cadastrado`);
      }
    }
  }

  // Importar plantões
  ilog(`\n🗓️ Importando ${entries.length} plantões de ${label}...`);
  let ok=0;
  for(let i=0;i<entries.length;i++){
    try{
      await push(ref(db,"escalas"),entries[i]);
      ok++;
      if(ok%25===0||ok===entries.length){
        ilog(`📅 ${ok}/${entries.length} importados`);
        if(bar)bar.style.width=Math.round((ok/entries.length)*100)+"%";
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,30));
  }
  if(bar)bar.style.width="100%";
  ilog(`\n🎉 CONCLUÍDO! ${ok} plantões de ${label} importados!`,"#FCD34D");
  ilog(`Acesse Calendário → ${label} 2026 📆`,"#93C5FD");
  toast(`${ok} plantões de ${label} importados!`,"📥");
};

window.resetGestor = async function(){
  if(!confirm("Resetar senha do gestor (CRM 11707) para 1234?")) return;
  try{
    await update(ref(db,"medicos/crm_11707"),{senha:"1234"});
    toast("Senha do gestor resetada para 1234! 🔐","✅");
  }catch(e){
    toast("Erro: "+e.message,"❌");
  }
};

window.limparImport = async function(){
  if(!confirm("Apagar escalas de Agosto 2026 importadas?"))return;
  const snap=await get(ref(db,"escalas"));
  const all=snap.val()||{};
  let count=0;
  for(const [key,val] of Object.entries(all)){
    if(val.month===7&&val.year===2026&&val.obs?.includes("Escala oficial")){
      await remove(ref(db,`escalas/${key}`));
      count++;
    }
  }
  toast(`${count} escalas removidas`,"🗑️");
};

// ─────────────────────────────────────
// CLOCK
// ─────────────────────────────────────
function startClock(){
  stopClock();
  clockT=setInterval(()=>{
    const cl=$("clock");if(cl)cl.textContent=new Date().toLocaleString("pt-BR");else{stopClock();return}
    const dl=$("dur-live");
    if(dl){const a=Object.entries(DB.plt).map(([k,v])=>({...v,key:k})).find(p=>p.medicoKey===U?.key&&p.status==="ativo");if(a)dl.textContent=dur(a.inicio,null);}
  },1000);
}
function stopClock(){if(clockT){clearInterval(clockT);clockT=null}}

// ─────────────────────────────────────
// INIT
// ─────────────────────────────────────
async function init(){
  await seed();
  if(U)listen();else render();
}
init();
</script>
